[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "__pycache__", "debug_glm.py", "debug_out.txt", "*.pyc"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"core/config.py" = ["E501"]
"targets/*.py" = ["E501"]
"agents/*.py" = ["E501"]
